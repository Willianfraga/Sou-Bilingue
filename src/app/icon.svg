<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2a0f5c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e3ff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="ondas" gradientUnits="userSpaceOnUse" x1="16" y1="18" x2="46" y2="48">
      <stop offset="0" stop-color="#22e3ff"/>
      <stop offset="0.55" stop-color="#9b7dff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- balão de fala hexagonal: conversa + tecnologia -->
  <path d="M32 3 L57 17 L57 43 L37 55 L27 62 L28 54 L7 43 L7 17 Z" fill="url(#fundo)" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>
  <!-- ondas de voz -->
  <g filter="url(#brilho)" fill="none" stroke="url(#ondas)" stroke-width="3.2" stroke-linecap="round">
    <path d="M18 30 v6"/>
    <path d="M24.5 24 v18"/>
    <path d="M31 19 v28"/>
    <path d="M37.5 25 v16"/>
    <path d="M44 28.5 v9"/>
  </g>
  <circle cx="50" cy="16" r="2.6" fill="#22e3ff"/>
</svg>
